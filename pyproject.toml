[project]
name = "get-me-in"
version = "0.1.0"
description = "The career sidekick that gets you in the room — and through the door"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "openai>=2.43.0",
    "python-dotenv>=1.2.2",
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "sentence-transformers>=5.6.0",
]

[[tool.uv.index]]
url = "https://mirrors.sjtug.sjtu.edu.cn/pypi/web/simple"
default = true
