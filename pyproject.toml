[project]
name = "get-me-in"
version = "0.1.0"
description = "The career sidekick that gets you in the room — and through the door"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "charset-normalizer>=3.4.7",
    "chromadb>=1.5.9",
    "json-repair",
    "openai>=2.43.0",
    "pdfplumber>=0.11.10",
    "pypdf>=6.0.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "sentence-transformers>=5.6.0",
]

[[tool.uv.index]]
name = "tuna"
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple/"
default = true
